# Загружает архив опубликованного GitHub-релиза новой версией файла на странице мода на Nexus Mods.
# Архив не пересобирается (для сборки нужна установленная игра): берётся ObenseuerRUS-<версия>.zip из релиза v<версия>.
# Описание релиза становится списком изменений этой версии на Nexus.
# Однократная настройка (секрет NEXUS_API_KEY, переменные NEXUS_MOD_URL и NEXUS_FILE_ID) — в README, «Сборка из исходников».
name: Nexus Mods

on:
  release:
    types: [published]
  # Повторная загрузка уже опубликованного релиза: gh workflow run nexus.yml -f tag=v<версия>
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза (например, v0.4.6)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  upload:
    # Пререлизы не получает автообновление, на Nexus их тоже не выкладываем.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Проверить настройки и версию
        id: meta
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_MOD_URL: ${{ vars.NEXUS_MOD_URL }}
          NEXUS_FILE_ID: ${{ vars.NEXUS_FILE_ID }}
        run: |
          missing=""
          [ -n "$NEXUS_API_KEY" ] || missing="$missing секрет NEXUS_API_KEY;"
          [ -n "$NEXUS_FILE_ID" ] || missing="$missing переменная NEXUS_FILE_ID;"
          url_re='nexusmods\.com/(games/)?([A-Za-z0-9_-]+)/mods/([0-9]+)'
          if [[ "$NEXUS_MOD_URL" =~ $url_re ]]; then
            game="${BASH_REMATCH[2]}" site_mod_id="${BASH_REMATCH[3]}"
          else
            missing="$missing переменная NEXUS_MOD_URL (ссылка на страницу мода);"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Не настроено:$missing см. README, «Сборка из исходников»."
            exit 1
          fi
          version="${TAG#v}"
          if [[ "$TAG" != v* || ! "$version" =~ ^[0-9A-Za-z.-]{1,50}$ ]]; then
            echo "::error::Тег '$TAG' не похож на v<версия>."
            exit 1
          fi
          {
            echo "game=$game"
            echo "site_mod_id=$site_mod_id"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Скачать архив из релиза
        id: archive
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          dir="$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "ObenseuerRUS-$VERSION.zip" --dir "$dir"
          echo "path=$dir/ObenseuerRUS-$VERSION.zip" >> "$GITHUB_OUTPUT"

      - name: Взять список изменений из описания релиза
        id: changelog
        run: |
          delim="CHANGELOG_$(openssl rand -hex 16)"
          {
            echo "text<<$delim"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | tr -d '\r'
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      # Список изменений API принимает только по глобальному ID мода, а не по номеру из ссылки на страницу.
      - name: Узнать ID мода в API v3
        id: mod
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          GAME: ${{ steps.meta.outputs.game }}
          SITE_MOD_ID: ${{ steps.meta.outputs.site_mod_id }}
        run: |
          out="$RUNNER_TEMP/mod.json"
          if ! curl -sS --fail-with-body -o "$out" -A "ObenseuerRUS-release" -H "apikey: $NEXUS_API_KEY" \
              "https://api.nexusmods.com/v3/games/$GAME/mods/$SITE_MOD_ID"; then
            cat "$out"; echo
            echo "::error::Не удалось получить мод $GAME/$SITE_MOD_ID. Проверьте NEXUS_MOD_URL и NEXUS_API_KEY."
            exit 1
          fi
          id=$(jq -r '.data.id // empty' "$out")
          [ -n "$id" ] || { cat "$out"; echo "::error::В ответе API нет ID мода."; exit 1; }
          echo "Мод: $(jq -r '.data.name' "$out") ($GAME/$SITE_MOD_ID → $id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Загрузить на Nexus Mods
        # Действие в бете и обновляет только уже существующий файл; закреплено на коммите тега v1.0.0-beta.11.
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          mod_id: ${{ steps.mod.outputs.id }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ steps.archive.outputs.path }}
          version: ${{ steps.meta.outputs.version }}
          display_name: ObenseuerRUS
          description: >-
            Русификатор Obenseuer. Установите BepInEx и Obenseuer Modding Framework, затем распакуйте архив
            в папку игры (где лежит Obenseuer.exe) с заменой файлов.
          category: main
          archive_existing_version: true
          update_mod_version: true
          changelog: ${{ steps.changelog.outputs.text }}
